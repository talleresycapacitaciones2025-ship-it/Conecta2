name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode Keystore (if secrets exist)
      if: env.KEYSTORE_BASE64 != ''
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo "Decodificando keystore..."
          echo $KEYSTORE_BASE64 | base64 --decode > app/release.keystore
          echo "KEYSTORE_PATH=app/release.keystore" >> $GITHUB_ENV
        else
          echo "No se encontró KEYSTORE_BASE64, se usará debug."
          echo "KEYSTORE_PATH=debug.keystore" >> $GITHUB_ENV
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK (Fallback)
      if: secrets.KEYSTORE_PASSWORD == ''
      run: ./gradlew assembleDebug

    - name: Build Release APK (If secrets exist)
      if: secrets.KEYSTORE_PASSWORD != ''
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
      run: ./gradlew assembleRelease

    - name: Upload Debug APK Artifact
      if: secrets.KEYSTORE_PASSWORD == ''
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK Artifact
      if: secrets.KEYSTORE_PASSWORD != ''
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
